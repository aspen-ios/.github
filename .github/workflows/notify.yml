name: Discord notification

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          repo = event["repository"]["full_name"]
          ref = event["ref"].rsplit("/", 1)[-1]
          head = event.get("head_commit") or {}
          commits = event.get("commits") or []
          author = (head.get("author") or {}).get("name") or event.get("pusher", {}).get("name", "?")

          files, adds, dels = [], 0, 0
          before, after = event.get("before", ""), event.get("after", "")
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/compare/{before}...{after}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "aspen-ci",
                  },
              )
              compare = json.load(urllib.request.urlopen(req))
              files = compare.get("files", [])
              adds = sum(f.get("additions", 0) for f in files)
              dels = sum(f.get("deletions", 0) for f in files)
          except Exception:
              for key in ("added", "modified", "removed"):
                  files += [{"filename": n, "additions": 0, "deletions": 0} for n in head.get(key, [])]

          shown = files[:15]
          lines = [f"{f['filename']} | +{f.get('additions', 0)} -{f.get('deletions', 0)}" for f in shown]
          if len(files) > len(shown):
              lines.append(f"... and {len(files) - len(shown)} more")

          embed = {
              "title": ((head.get("message") or "push").splitlines() or ["push"])[0][:256],
              "url": head.get("url") or event["repository"]["html_url"],
              "color": 3066993,
              "fields": [
                  {"name": "Repository", "value": repo, "inline": True},
                  {"name": "Branch", "value": ref, "inline": True},
                  {"name": "Commit", "value": f"`{after[:7]}`", "inline": True},
                  {"name": "Event", "value": "push", "inline": True},
                  {"name": "Author", "value": author, "inline": True},
                  {"name": "Commits", "value": str(len(commits) or 1), "inline": True},
                  {"name": "Changes", "value": f"{len(files)} files | +{adds} -{dels}"},
                  {"name": "Files", "value": "```\n" + ("\n".join(lines)[:900] or "none") + "\n```"},
              ],
              "timestamp": head.get("timestamp", ""),
              "footer": {"text": "Aspen CI"},
          }
          payload = {"username": "Aspen Github", "content": "@here", "embeds": [embed]}
          req = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Aspen-CI/1.0 (github-actions)",
              },
          )
          urllib.request.urlopen(req).read()
          PY
